<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopZone HomePage</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            height: 100vh;
            background-color: #f4f4f4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }

        .lottie {
            width: 80%;
            max-width: 600px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 5vw;
            font-weight: 700;
            margin: 0;
        }

        .contributors {
            font-size: 3vw;
            font-weight: 400;
            opacity: 0.7;
            text-align: center;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 8vw;
            }
            .contributors {
                font-size: 4vw;
            }
        }
    </style>
</head>
<body>
    <script src="https://unpkg.com/@dotlottie/player-component@latest/dist/dotlottie-player.mjs" type="module"></script>

    <dotlottie-player
        class="lottie"
        src="https://lottie.host/7d26b084-5c2c-439d-ae7a-638ba325def9/RfKOTWhnpP.json"
        background="transparent"
        speed="1"
        loop
        autoplay
    ></dotlottie-player>

    <h1>Website is Under Construction</h1>
    <div class="contributors">Contributors: Vyankatesh Odilwar, Khanderao Wakde, Mayuri Eklare</div>
</body>
</html>
